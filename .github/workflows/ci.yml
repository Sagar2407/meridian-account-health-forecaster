name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --locked --extra dev
      - name: Lint and format check
        run: |
          uv run ruff check backend evaluation
          uv run ruff format --check backend evaluation
      - name: Type check
        run: uv run mypy
      # The synthetic archive is git-ignored, so CI cannot exercise the data
      # layer: those tests skip here and the coverage threshold is not
      # meaningful. The full data gate is `make validate-data`, which sets
      # MERIDIAN_REQUIRE_DATASET=1 so it cannot pass without the dataset.
      - name: Test (data-layer tests skip without the archive)
        run: uv run pytest --cov-fail-under=0
      - name: Scan repository
        run: python scripts/check_repository.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local stack
        run: docker compose build
