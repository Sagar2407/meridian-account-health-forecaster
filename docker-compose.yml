name: meridian-autonomous-agent

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MERIDIAN_ENVIRONMENT: ${MERIDIAN_ENVIRONMENT:-development}
      MERIDIAN_LOG_LEVEL: ${MERIDIAN_LOG_LEVEL:-INFO}
      MERIDIAN_API_HOST: 0.0.0.0
      MERIDIAN_API_PORT: 8000
      MERIDIAN_CORS_ORIGINS: ${MERIDIAN_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${MERIDIAN_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${MERIDIAN_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
