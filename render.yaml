# Reproducible Render configuration (plan section 24.2).
#
# One web service from one Dockerfile. Every value that decides what the demo
# may spend is set here rather than in the dashboard, so the deployment's cost
# and safety posture is reviewable in the repository -- which is the point of
# committing infrastructure at all.
#
# The model key is deliberately NOT here. `sync: false` means Render prompts for
# it once and stores it as a secret; a key in this file would be a key in the
# git history.

services:
  - type: web
    name: meridian
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    autoDeploy: false

    envVars:
      - key: MERIDIAN_ENVIRONMENT
        value: production
      - key: MERIDIAN_LOG_LEVEL
        value: INFO

      # Section 24.3. Demo mode restricts assessments to the synthetic
      # portfolio, replaces free text with a curated question, and refuses
      # portfolio scans and evaluation runs outright.
      - key: MERIDIAN_DEMO_MODE
        value: "true"

      # Per-client and service-wide run limits. A free instance has one CPU;
      # these keep one visitor from consuming the whole budget.
      - key: MERIDIAN_RATE_LIMIT_RUNS_PER_HOUR
        value: "20"
      - key: MERIDIAN_RATE_LIMIT_DAILY_RUNS
        value: "200"

      # Concurrency and per-run spend. The graph's own budget caps a single run
      # at eight provider attempts; this caps how many run at once.
      - key: MERIDIAN_SCAN_CONCURRENCY
        value: "2"

      # Section 24.3: no unattended scheduled spending in a public deployment.
      # Demo mode refuses the scheduler anyway; this states the intent twice.
      - key: MERIDIAN_ENABLE_SCHEDULER
        value: "false"

      # The browser calls the same origin it was served from, so the allowlist
      # is the service's own URL. Render substitutes it at deploy time.
      - key: MERIDIAN_CORS_ORIGINS
        fromService:
          type: web
          name: meridian
          property: hostport

      # Set once, in the Render dashboard, and stored as a secret. Leave it
      # empty to run the demo entirely on cached and deterministic paths: the
      # system completes without a provider and says so in its own limitations.
      - key: MERIDIAN_LLM_API_KEY
        sync: false
      - key: MERIDIAN_LLM_PROVIDER
        value: openai_compatible

      # A 2.6B open-weight model on OpenRouter's free tier, so a public demo
      # can exercise the model-backed path without a bill. It is deliberately
      # not a frontier model: this deployment exists to show that the planner,
      # the adjudicator and output verification work end to end, and the
      # narrative's wording is the only thing a larger model would improve.
      # Every published metric in this repository is the deterministic run, not
      # this one. Swap the slug for `anthropic/claude-sonnet-4.5` -- or any
      # OpenRouter model -- to change nothing but the prose.
      #
      # Verified on this model: planner and adjudicator both model-written,
      # output verification passed first attempt, 7,382 tokens, 0.00 USD
      # (`artifacts/provider/`).
      #
      # Free slugs are rate-limited per day, and the limits below allow more
      # runs than a free-tier account will be served. Past that point the
      # provider fails and the adjudicator falls back to the deterministic
      # narrative, saying so in the decision's own limitations -- the run still
      # completes, still routes, still cites real evidence.
      - key: MERIDIAN_LLM_MODEL
        value: liquid/lfm-2.5-2.6b:free
      - key: MERIDIAN_LLM_BASE_URL
        value: https://openrouter.ai/api/v1

      # `auto` asks for a server-enforced JSON Schema and steps down if the
      # server refuses. This model supports the strict form, so no step-down
      # happens; the setting is explicit because it is what makes swapping in a
      # smaller or locally-hosted model a one-line change.
      - key: MERIDIAN_LLM_STRUCTURED_OUTPUT
        value: auto

      # LangSmith mirroring is optional and off. The application is fully
      # functional without it (plan section 21.2).
      - key: LANGSMITH_TRACING
        value: "false"

    # A free instance has an ephemeral filesystem: assessment history and
    # review cases live in the container layer. Measured, because the loose
    # version of this claim was wrong -- they survive a restart of the same
    # container and are gone whenever the container is *replaced*, which a
    # deploy and a spin-down both do. Section 24.3 permits exactly that --
    # "keep review and assessment storage ephemeral in the free public demo"
    # -- and the README says so rather than letting a visitor assume their
    # override was kept.
    disk: null
